# X1-Predict Docker Compose Configuration
# FAANG Enterprise-Grade 24/7 Operation
version: '3.8'

services:
  # Main X1-Predict Application
  x1-predict:
    build:
      context: .
      dockerfile: Dockerfile.x1predict
    container_name: x1-predict-main
    restart: always
    environment:
      - X1_MODE=hybrid
      - X1_RISK_PROFILE=moderate
      - X1_ENVIRONMENT=production
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - ADMIN_CONTROL_PLANE_URL=${ADMIN_CONTROL_PLANE_URL}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    ports:
      - "8080:8080"  # Dashboard
      - "8081:8081"  # API
    networks:
      - x1-predict-network
    depends_on:
      - redis
      - postgres
      - mongodb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  # Redis for caching and real-time data
  redis:
    image: redis:7-alpine
    container_name: x1-predict-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - x1-predict-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # PostgreSQL for relational data
  postgres:
    image: postgres:15-alpine
    container_name: x1-predict-postgres
    restart: always
    environment:
      - POSTGRES_DB=x1predict
      - POSTGRES_USER=x1predict
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - x1-predict-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U x1predict"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # MongoDB for document storage
  mongodb:
    image: mongo:6
    container_name: x1-predict-mongodb
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=x1predict
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=x1predict
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - x1-predict-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
  
  # Scraper Service (runs independently)
  x1-scraper:
    build:
      context: .
      dockerfile: Dockerfile.x1predict
    container_name: x1-predict-scraper
    restart: always
    command: python -m src.scrapers.advanced_scraping_system
    environment:
      - X1_ENVIRONMENT=production
      - SCRAPER_MODE=continuous
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - x1-predict-network
    depends_on:
      - redis
      - mongodb
  
  # Learning Engine (runs periodically)
  x1-learning:
    build:
      context: .
      dockerfile: Dockerfile.x1predict
    container_name: x1-predict-learning
    restart: always
    command: python -m src.learning.enhanced_recursive_learning
    environment:
      - X1_ENVIRONMENT=production
      - LEARNING_INTERVAL_HOURS=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - x1-predict-network
    depends_on:
      - redis
      - postgres
  
  # Dashboard Frontend
  x1-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: x1-predict-dashboard
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://x1-predict:8081
      - NODE_ENV=production
    networks:
      - x1-predict-network
    depends_on:
      - x1-predict
  
  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: x1-predict-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - x1-predict-network
  
  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: x1-predict-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - x1-predict-network
    depends_on:
      - prometheus
  
  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: x1-predict-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - x1-predict-network
    depends_on:
      - x1-predict
      - x1-dashboard

networks:
  x1-predict-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  mongodb-data:
  prometheus-data:
  grafana-data:
