# X1-Predict Configuration
# FAANG Enterprise-Grade Financial Prediction System

# System Metadata
system:
  name: "X1-Predict"
  version: "1.0.0"
  codename: "Enterprise Quantum Predictor"
  environment: "production"
  timezone: "UTC"

# Operation Modes
modes:
  current_mode: "hybrid"  # auto | hybrid | manual
  auto:
    enabled: true
    max_trades_per_day: 50
    max_position_size_pct: 10.0
    require_confirmation: false
  hybrid:
    enabled: true
    ai_recommendation_threshold: 0.75
    require_confirmation: true
  manual:
    enabled: true
    ai_assistance: true

# Multi-Mind Agent Brain Configuration
multi_mind:
  enabled: true
  vision_cortex_integration: true
  unified_intelligence: true
  shared_memory: true
  agents:
    - name: "market_analyst"
      type: "financial_analyst"
      priority: "high"
      capabilities: ["technical_analysis", "fundamental_analysis", "sentiment_analysis"]
    - name: "risk_manager"
      type: "risk_controller"
      priority: "critical"
      capabilities: ["risk_assessment", "portfolio_optimization", "stop_loss"]
    - name: "crypto_specialist"
      type: "crypto_expert"
      priority: "high"
      capabilities: ["blockchain_analysis", "defi_tracking", "token_metrics"]
    - name: "pattern_recognizer"
      type: "ml_specialist"
      priority: "high"
      capabilities: ["pattern_detection", "anomaly_detection", "signal_processing"]
    - name: "social_intelligence"
      type: "social_analyst"
      priority: "medium"
      capabilities: ["sentiment_tracking", "trend_detection", "influence_analysis"]
    - name: "quantum_simulator"
      type: "simulation_engine"
      priority: "high"
      capabilities: ["timeline_simulation", "scenario_analysis", "probability_calculation"]

# Google Cloud AI Configuration
google_cloud:
  project_id: "${GCP_PROJECT_ID}"
  region: "us-central1"
  automl:
    enabled: true
    model_type: "forecast"
    optimization_objective: "minimize-rmse"
    training_budget_hours: 24
  vertex_ai:
    enabled: true
    endpoint_region: "us-central1"
    model_monitoring: true
    prediction_service: true
  gen_ai:
    enabled: true
    model: "gemini-pro"
    temperature: 0.3
    max_output_tokens: 2048

# Infinity Portfolio System
portfolios:
  max_portfolios: -1  # -1 = unlimited
  default_initial_balance: 100000.0
  currency: "USD"
  risk_profiles:
    conservative:
      max_position_size: 5.0
      max_portfolio_volatility: 10.0
      stop_loss_pct: 2.0
      take_profit_pct: 5.0
      diversification_min: 10
    moderate:
      max_position_size: 10.0
      max_portfolio_volatility: 20.0
      stop_loss_pct: 5.0
      take_profit_pct: 15.0
      diversification_min: 7
    risky:
      max_position_size: 20.0
      max_portfolio_volatility: 35.0
      stop_loss_pct: 10.0
      take_profit_pct: 30.0
      diversification_min: 5
    alpha_reward:
      max_position_size: 50.0
      max_portfolio_volatility: 50.0
      stop_loss_pct: 20.0
      take_profit_pct: 100.0
      diversification_min: 3

# Timeframe Configuration
timeframes:
  available:
    - "1h"    # 1 hour (intraday)
    - "4h"    # 4 hours
    - "1d"    # 1 day
    - "3d"    # 3 days
    - "7d"    # 7 days / 1 week
    - "15d"   # 15 days
    - "30d"   # 30 days / 1 month
    - "60d"   # 60 days / 2 months
    - "90d"   # 90 days / 1 quarter
    - "180d"  # 180 days / 6 months
    - "365d"  # 1 year
    - "730d"  # 2 years
  default: "7d"
  sliding_scale:
    enabled: true
    min_hours: 1
    max_days: 3650  # 10 years

# Trading System
trading:
  mode: "paper"  # paper | testnet | mainnet
  paper_trading:
    enabled: true
    initial_balance: 100000.0
    commission_pct: 0.1
    slippage_pct: 0.05
  testnet:
    enabled: true
    networks: ["ethereum_goerli", "binance_testnet", "polygon_mumbai"]
  mainnet:
    enabled: false  # Requires explicit admin approval
    require_2fa: true
    max_daily_loss_pct: 5.0
  
  # Easy toggle for switching modes
  quick_toggle:
    paper_to_testnet: true
    testnet_to_mainnet: false  # Requires admin
    confirmation_required: true

# Wallet System
wallets:
  shadow_wallet:
    enabled: true
    auto_create: true
    encrypted: true
  regular_wallet:
    enabled: true
    platforms:
      - "metamask"
      - "coinbase"
      - "binance"
      - "kraken"
      - "alpaca"
  connectors:
    metamask:
      enabled: true
      auto_connect: false
    coinbase:
      enabled: true
      api_key_required: true
    binance:
      enabled: true
      api_key_required: true
    kraken:
      enabled: true
      api_key_required: true
    alpaca:
      enabled: true
      api_key_required: true

# Data Acquisition
data_acquisition:
  scraping:
    headless_browser:
      enabled: true
      browser: "chromium"
      async: true
      max_concurrent: 10
      retry_attempts: 3
      timeout_seconds: 30
    
    social_media:
      enabled: true
      platforms:
        - name: "twitter"
          enabled: true
          keywords: ["crypto", "bitcoin", "stocks", "market"]
        - name: "reddit"
          enabled: true
          subreddits: ["wallstreetbets", "cryptocurrency", "stocks"]
        - name: "discord"
          enabled: true
          servers: []
        - name: "telegram"
          enabled: true
          channels: []
    
    financial_sites:
      - url: "https://finance.yahoo.com"
        type: "market_data"
        frequency: "1h"
      - url: "https://www.bloomberg.com"
        type: "news"
        frequency: "30m"
      - url: "https://www.coindesk.com"
        type: "crypto_news"
        frequency: "15m"
      - url: "https://coinmarketcap.com"
        type: "crypto_data"
        frequency: "5m"
      - url: "https://www.investing.com"
        type: "market_data"
        frequency: "1h"
  
  rest_api_agent:
    enabled: true
    shadow_mode: true
    opportunity_detection: true
    pattern_recognition: true
    early_signal_detection: true

# Prediction Engine
predictions:
  universal_framework:
    enabled: true
    domains:
      - "financial_markets"
      - "cryptocurrency"
      - "sports_betting"
      - "commodities"
      - "forex"
      - "custom"
  
  models:
    ensemble:
      enabled: true
      models:
        - "automl"
        - "lstm"
        - "transformer"
        - "prophet"
        - "xgboost"
        - "lightgbm"
      voting: "weighted"
    
    top_systems:
      - name: "vertex_automl"
        weight: 0.35
        priority: 1
      - name: "prophet_lstm_hybrid"
        weight: 0.30
        priority: 2
      - name: "transformer_ensemble"
        weight: 0.35
        priority: 3
  
  confidence_threshold: 0.70
  min_accuracy_required: 0.65

# Simulation Engine
simulation:
  quantum_like_processing:
    enabled: true
    parallel_instances: 10
    max_timelines: 100
  
  timeframes:
    days_ahead: [1, 7, 14, 30, 60, 90, 180, 365]
    months_ahead: [1, 3, 6, 12, 24, 36]
    years_ahead: [1, 2, 3, 5, 10]
  
  scenarios:
    - "bullish"
    - "bearish"
    - "sideways"
    - "volatile"
    - "black_swan"

# Recursive Learning
learning:
  enabled: true
  self_reflection:
    enabled: true
    frequency: "daily"
    depth: "deep"
  
  feedback_loop:
    enabled: true
    real_time: true
    batch_updates: true
  
  accuracy_tracking:
    enabled: true
    metrics:
      - "prediction_accuracy"
      - "profit_loss"
      - "win_rate"
      - "sharpe_ratio"
      - "max_drawdown"
  
  continuous_improvement:
    auto_retrain: true
    retrain_threshold: 0.60
    model_selection: "automatic"

# Dashboard & Admin Control Plane
dashboard:
  enabled: true
  real_time: true
  websocket: true
  port: 8080
  
  features:
    - "live_predictions"
    - "portfolio_tracking"
    - "trade_history"
    - "analytics"
    - "risk_metrics"
    - "performance_charts"
  
  proactive_chat:
    enabled: true
    auto_alerts: true
    scheduling: true
    recommendations: true
  
  admin_control:
    enabled: true
    integration_endpoint: "${ADMIN_CONTROL_PLANE_URL}"
    api_key: "${ADMIN_API_KEY}"

# No-Code Features
no_code:
  crypto_creation:
    enabled: true
    templates:
      - "erc20_token"
      - "nft_collection"
      - "defi_protocol"
    wizard: true
  
  automation:
    alert_builder: true
    strategy_builder: true
    workflow_builder: true

# Knowledge Base
knowledge_base:
  runbooks:
    path: "/data/runbooks"
    auto_update: true
  
  secrets:
    path: "/data/secrets"
    encrypted: true
  
  tips_tricks:
    path: "/data/tips"
    categories:
      - "trading"
      - "analysis"
      - "risk_management"
      - "crypto"
      - "automation"
  
  insider_knowledge:
    enabled: true
    sources: "curated"
    update_frequency: "weekly"

# Security & Compliance
security:
  encryption:
    at_rest: true
    in_transit: true
    algorithm: "AES-256"
  
  authentication:
    mfa_required: true
    session_timeout_minutes: 60
    max_failed_attempts: 3
  
  audit:
    enabled: true
    log_all_actions: true
    retention_days: 365

# Monitoring & Alerting
monitoring:
  enabled: true
  metrics:
    - "system_health"
    - "prediction_accuracy"
    - "trade_performance"
    - "api_latency"
    - "error_rate"
  
  alerts:
    email: true
    sms: true
    slack: true
    admin_dashboard: true
  
  thresholds:
    accuracy_drop_pct: 10.0
    max_drawdown_pct: 15.0
    api_latency_ms: 500
    error_rate_pct: 5.0

# Docker & Deployment
deployment:
  docker:
    enabled: true
    compose: true
    health_check: true
    restart_policy: "always"
  
  kubernetes:
    enabled: false
    replicas: 3
    auto_scaling: true
  
  backup:
    enabled: true
    frequency: "daily"
    retention_days: 30
    cloud_sync: true

# Performance
performance:
  cache:
    enabled: true
    backend: "redis"
    ttl_seconds: 3600
  
  optimization:
    async_operations: true
    batch_processing: true
    connection_pooling: true
    query_optimization: true
  
  targets:
    api_response_ms: 100
    prediction_time_ms: 500
    scraping_rate: "1000/minute"
    uptime_pct: 99.9
